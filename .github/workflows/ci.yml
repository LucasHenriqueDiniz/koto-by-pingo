name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A action de pnpm não recebe 'version' — ela lê o campo packageManager do
# package.json, que é o que mantém o CI e as máquinas locais na mesma versão.

jobs:
  check:
    name: Workspace Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # As libs compartilhadas são checadas à parte porque os artefatos as
      # consomem já compiladas — um erro aqui aparece nos dois artifacts.
      - name: Typecheck libs
        run: pnpm run typecheck:libs

      # `build` aqui NÃO duplica o Cloudflare. O Pages publica um único pacote
      # (artifacts/koto); o script é `typecheck && pnpm -r --if-present run build`,
      # que alcança os outros 9 do workspace — api-server, mockup-sandbox,
      # cloudflare, e as libs api-client-react/api-spec/api-zod/db. Nenhum host
      # compila esses, então este passo é a única coisa que os olha.
      - name: Typecheck & build workspace
        run: pnpm run build
