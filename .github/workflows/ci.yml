name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The pnpm action gets no 'version' — it reads the packageManager field from
# package.json, which is what keeps CI and local machines on the same version.

jobs:
  check:
    name: Workspace Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # The shared libs are checked separately because the artifacts consume them
      # already compiled — an error here surfaces in both artifacts.
      - name: Typecheck libs
        run: pnpm run typecheck:libs

      # `build` here does NOT duplicate Cloudflare. Pages publishes a single package
      # (artifacts/koto); the script is `typecheck && pnpm -r --if-present run build`,
      # which reaches the other 9 in the workspace — api-server, mockup-sandbox,
      # cloudflare, and the api-client-react/api-spec/api-zod/db libs. No host builds
      # those, so this step is the only thing that looks at them.
      - name: Typecheck & build workspace
        run: pnpm run build
